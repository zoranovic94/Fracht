<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1f3a56" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172a3d" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="icon" href="icon-192.png?v=4">
<link rel="apple-touch-icon" href="icon-192.png?v=4">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Frachtradar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: App-Leiste + Reiter oben (fest), darunter eine Frachtliste wie die Timocom-Tabelle (2 Zeilen je Angebot), Antippen öffnet die Detailseite */
:root {
  --bg: #e9edf2;
  --surface: #ffffff;
  --head: #34506b;
  --head-fg: #ffffff;
  --fg: #18222d;
  --muted: #5b6876;
  --line: #d3dae2;
  --accent: #c8102e;
  --link: #1f5f9e;
  --gold-bg: #ffd966; --gold: #9a6b00;
  --gruen-bg: #dcf2e1; --gruen: #2e7d32;
  --gelb-bg: #fffbe3; --gelb: #e0b400;
  --rot-bg: #fde3da; --rot: #c2410c;
  --anfrage-bg: #e1ecfa; --anfrage: #1c64c4;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10161d; --surface: #18212b; --head: #243a50; --head-fg: #f1f5f9; --fg: #e5ebf1; --muted: #98a6b5; --line: #2a3846;
    --accent: #ef4d63; --link: #7fb3ec;
    --gold-bg: #5a4300; --gold: #ffcc33; --gruen-bg: #17321e; --gruen: #6fcf7f; --gelb-bg: #2a2714; --gelb: #cfae3f;
    --rot-bg: #3a1e14; --rot: #fb8a5a; --anfrage-bg: #142a45; --anfrage: #78aef0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10161d; --surface: #18212b; --head: #243a50; --head-fg: #f1f5f9; --fg: #e5ebf1; --muted: #98a6b5; --line: #2a3846;
  --accent: #ef4d63; --link: #7fb3ec;
  --gold-bg: #5a4300; --gold: #ffcc33; --gruen-bg: #17321e; --gruen: #6fcf7f; --gelb-bg: #2a2714; --gelb: #cfae3f;
  --rot-bg: #3a1e14; --rot: #fb8a5a; --anfrage-bg: #142a45; --anfrage: #78aef0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--font); font-size: 14px; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--head); }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* App-Leiste */
.kopf { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--head); color: var(--head-fg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px 0; }
.kopf-zeile { display: flex; align-items: center; gap: 10px; }
.marke { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; letter-spacing: .01em; }
.marke i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(255,255,255,.18); }
.stand { margin-left: auto; font-size: 12px; opacity: .85; text-align: right; line-height: 1.25; }
.ikon { border: 0; background: rgba(255,255,255,.12); color: var(--head-fg); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 17px; }
.ikon:focus-visible, .reiter button:focus-visible, .zeile:focus-visible, .knopf:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.reiter { display: flex; gap: 2px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.reiter button { border: 0; background: transparent; color: var(--head-fg); opacity: .75; padding: 9px 10px 10px; font-size: 13px; font-weight: 600;
  border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; }
.reiter button[aria-selected="true"] { opacity: 1; border-bottom-color: var(--head-fg); }
.reiter b { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 10px; background: rgba(255,255,255,.2); font-size: 11px; line-height: 18px; }

/* Leiste über der Tabelle */
.werkzeug { display: flex; align-items: center; gap: 8px; padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.werkzeug label { font-size: 12px; color: var(--muted); }
.werkzeug select { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.hinweis { margin-left: auto; font-size: 12px; color: var(--muted); }
.beispiel { margin: 0 max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); padding: 8px 10px; border-radius: 6px;
  background: var(--anfrage-bg); color: var(--fg); font-size: 12.5px; line-height: 1.4; }

/* Tabelle wie in Timocom */
.tabelle { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.spalten, .zeile { display: grid; grid-template-columns: 6px minmax(0, 1fr) 14px minmax(0, 1fr) 24px 38px 72px; column-gap: 5px; align-items: start;
  padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.spalten { background: var(--head); color: var(--head-fg); font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding-block: 7px; opacity: .92; }
.spalten span:last-child, .zeile .c-preis { text-align: right; }
.spalten .c-km, .zeile .c-km { text-align: right; }
/* 5.3: Lade-/Entladestellen (L/E) als eigene Spalte – 1/1 blass, mehr Stellen kräftig */
.spalten .c-le, .zeile .c-le { text-align: center; align-items: center; }
.zeile .c-le b { font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.zeile .c-le b.eins { opacity: .45; font-weight: 600; }
.spalten .c-le { display: flex; justify-content: center; } .le-symbol { width: 12px; height: 13px; display: block; margin-top: -1px; }
/* lange Ortsnamen lieber trennen (Mönchen-gladbach) als abschneiden */
.zeile .c-ort b { hyphens: auto; -webkit-hyphens: auto; overflow-wrap: anywhere; }
/* schmale Handys: Spalten enger, Uhrzeiten etwas kleiner, damit „08:00–10:00“ ganz sichtbar bleibt */
@media (max-width: 380px) { .spalten, .zeile { grid-template-columns: 5px minmax(0, 1fr) 11px minmax(0, 1fr) 22px 33px 68px; column-gap: 4px; }
  .zeile .c-ort .uhr { font-size: 12.5px; letter-spacing: -.02em; } .zeile .c-le b { font-size: 12.5px; } .zeile .c-preis b { font-size: 15px; } }
.zeile { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); text-align: left; padding-block: 9px; cursor: pointer; }
.zeile:last-child { border-bottom: 0; }
.zeile > span { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.zeile b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zeile .c-ort b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
.zeile .c-ort span { font-variant-numeric: tabular-nums; white-space: normal; line-height: 1.3; }
.zeile .c-ort span.heute { color: var(--accent); font-weight: 600; }
.zeile .c-ort .uhr { font-style: normal; white-space: nowrap; display: inline-block; }
.zeile .pfeil { color: var(--muted); font-size: 14px; line-height: 1.25; text-align: center; }
.zeile span span, .zeile small { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zeile small { grid-column: 2 / -1; margin-top: 3px; }
.streifen { align-self: stretch; margin-block: -9px; }
.f-gold { background: var(--gold-bg); } .f-gold .streifen { background: var(--gold); width: 7px; }
.f-gold .c-preis b { font-size: 1.08em; }
.f-gruen { background: var(--gruen-bg); } .f-gruen .streifen { background: var(--gruen); }
.f-gelb { background: var(--gelb-bg); } .f-gelb .streifen { background: var(--gelb); }
.f-rot { background: var(--rot-bg); } .f-rot .streifen { background: var(--rot); }
.f-anfrage { background: var(--anfrage-bg); } .f-anfrage .streifen { background: var(--anfrage); }
.prozent { font-size: 12.5px; font-weight: 600; }
@keyframes blinken { 0%, 100% { box-shadow: inset 0 0 0 0 transparent; } 50% { box-shadow: inset 0 0 0 3px var(--accent); } }
.zeile.blink { animation: blinken .9s ease-in-out 5; }
@media (prefers-reduced-motion: reduce) { .zeile.blink { animation: none; box-shadow: inset 0 0 0 3px var(--accent); } }
.ikon.aus { opacity: .55; }
.heute { color: var(--accent); }
.leer { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; }
.gruppe { padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px 14px; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); background: var(--bg); border-bottom: 1px solid var(--line); }
.gruppe.frisch { color: var(--accent); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.allegesehen { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 4px 8px; font-size: 11.5px; font-weight: 600;
  text-transform: none; letter-spacing: 0; cursor: pointer; }
.neu, .zeile .c-ort .neu { color: #fff; }
.neu { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .04em; vertical-align: 2px; }
.unten { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 55; display: grid; gap: 8px; pointer-events: none; }
.unten > * { pointer-events: auto; }
.tonsperre { background: #c8102e; color: #fff;
  border: 0; border-radius: 10px; padding: 12px 14px; font: 600 15px/1.35 inherit; text-align: left; box-shadow: 0 4px 16px rgba(0,0,0,.3); cursor: pointer; }
.tonsperre[hidden], .alarm[hidden] { display: none; }
/* Klingel-Leiste: welche Tour gerade geklingelt hat – antippen öffnet sie */
.alarm { display: grid; gap: 6px; background: var(--head); color: var(--head-fg); border-radius: 12px; padding: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.35); border: 3px solid var(--accent); }
.alarm-kopf { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; opacity: .85; padding-inline: 4px; }
.alarm-kopf button { background: transparent; border: 0; color: inherit; font-size: 22px; line-height: 1; padding: 2px 6px; cursor: pointer; }
.alarm-tour { display: block; width: 100%; text-align: left; background: rgba(255,255,255,.12); color: inherit; border: 0; border-radius: 8px; padding: 10px 12px; font: 600 15px/1.35 inherit; cursor: pointer; }
.alarm-tour small { display: block; font-weight: 500; opacity: .85; font-size: 13px; }
.zeile.klingel { box-shadow: inset 0 0 0 3px var(--accent); }
@media (prefers-reduced-motion: no-preference) { .zeile.klingel { animation: blinken 1.2s ease-in-out infinite; } .alarm { animation: rein .2s ease-out; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg);
  padding: 10px 14px; border-radius: 8px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }

/* Detailseite */
.detail { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.d-kopf { position: sticky; top: 0; z-index: 2; background: var(--head); color: var(--head-fg); display: flex; align-items: center; gap: 10px; padding-block: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.d-kopf h1 { margin: 0; font-size: 16px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-inhalt { display: flex; flex-direction: column; gap: 10px; padding-block: 12px 24px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; }
.preisblock { border-radius: 8px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
.preisblock .gross { font-size: 26px; font-weight: 700; }
.preisblock .proz { font-size: 20px; font-weight: 700; text-align: right; }
.preisblock .klein { font-size: 12.5px; color: var(--muted); }
.preisblock .klein:last-child { text-align: right; }
.knoepfe { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.knopf { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; padding: 6px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--link); font-weight: 600; font-size: 13px; text-decoration: none; text-align: center; }
.knopf span { font-size: 18px; line-height: 1; }
.knopf.aus { color: var(--muted); pointer-events: none; opacity: .55; }
.abschnitt { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.abschnitt h2 { margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  background: color-mix(in srgb, var(--head) 10%, var(--surface)); border-bottom: 1px solid var(--line); }
.feld { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.feld:last-child { border-bottom: 0; }
.feld dt { color: var(--muted); font-size: 12.5px; padding-top: 1px; }
.feld dd { margin: 0; overflow-wrap: anywhere; user-select: text; }
.stelle { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.stelle:last-child { border-bottom: 0; }
.stelle i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-weight: 700; background: var(--bg); }
.stelle .ort { font-weight: 600; }
.stelle .zeit { color: var(--muted); font-size: 13px; }
.notiz { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; line-height: 1.4; }
.notiz:last-child { border-bottom: 0; }

/* Einstellungen */
.blatt { position: fixed; inset: auto 0 0 0; z-index: 50; max-height: 88vh; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
  box-shadow: 0 -8px 30px rgba(0,0,0,.18); padding-block: 16px calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; max-width: 640px; margin: 0 auto; }
.blatt h2 { margin: 0; font-size: 16px; }
.blatt p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.blatt label { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.blatt select { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); min-width: 0; }
.blatt .probe { border: 1px solid var(--line); background: var(--surface); padding: 9px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.blatt input { font: inherit; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
.blatt .reihe { display: flex; gap: 8px; justify-content: flex-end; }
.blatt .reihe button { border: 1px solid var(--line); background: var(--surface); padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
.blatt .reihe button.haupt { background: var(--head); color: var(--head-fg); border-color: var(--head); }
.schleier { position: fixed; inset: 0; z-index: 45; background: rgba(0,0,0,.35); }
@media (prefers-reduced-motion: no-preference) { .detail, .blatt { animation: rein .16s ease-out; } @keyframes rein { from { transform: translateY(12px); opacity: .6; } } }

/* ===== Optik 3.7: ruhiger Hintergrund, Karten statt Tabellenzeilen, Reiter als Pillen, Live-Punkt ===== */
:root { --bg: #edf1f6; --head: #1f3a56; --head2: #2f5c84; --karte-schatten: 0 1px 2px rgba(16,24,40,.06), 0 2px 6px rgba(16,24,40,.07); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1319; --head: #172a3d; --head2: #23405c; --karte-schatten: 0 1px 0 rgba(255,255,255,.04), 0 2px 8px rgba(0,0,0,.45); } }
:root[data-theme="dark"] { --bg: #0d1319; --head: #172a3d; --head2: #23405c; --karte-schatten: 0 1px 0 rgba(255,255,255,.04), 0 2px 8px rgba(0,0,0,.45); }
.kopf, body::before { background: linear-gradient(135deg, var(--head) 0%, var(--head2) 100%); }
.kopf { box-shadow: 0 2px 10px rgba(16,24,40,.18); padding-block: 12px 0; }
.marke { font-size: 18px; letter-spacing: -.01em; }
.marke i { width: 11px; height: 11px; background: #9aa7b4; box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
body.ist-live .marke i { background: #34d17a; box-shadow: 0 0 0 3px rgba(52,209,122,.28); }
@media (prefers-reduced-motion: no-preference) { body.ist-live .marke i { animation: puls 2.4s ease-out infinite; }
  @keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(52,209,122,.55); } 70% { box-shadow: 0 0 0 9px rgba(52,209,122,0); } 100% { box-shadow: 0 0 0 0 rgba(52,209,122,0); } } }
.ikon { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.16); transition: background .15s; }
.ikon:active { background: rgba(255,255,255,.24); }
.reiter { gap: 6px; margin-top: 12px; padding-bottom: 12px; }
.reiter button { border: 0; border-radius: 999px; padding: 7px 12px; background: rgba(255,255,255,.10); opacity: 1; color: rgba(255,255,255,.88); font-size: 13px; }
.reiter button[aria-selected="true"] { background: #fff; color: var(--head); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.reiter b { background: rgba(255,255,255,.18); color: inherit; font-weight: 700; }
.reiter button[aria-selected="true"] b { background: var(--head); color: #fff; }
.reiter b.hat-neu { background: var(--accent); color: #fff; }
.werkzeug { padding-block: 12px 6px; }
.werkzeug select { border-radius: 999px; padding: 6px 12px; font-weight: 600; box-shadow: var(--karte-schatten); border-color: transparent; }
.tabelle { background: transparent; border: 0; padding-bottom: 12px; }
.spalten { background: transparent; color: var(--muted); opacity: 1; font-size: 10.5px; padding-block: 2px 6px; margin-inline: 10px; }
.zeile { margin: 0 10px 8px; width: calc(100% - 20px); border: 0; border-radius: 14px; box-shadow: var(--karte-schatten); overflow: hidden; padding-block: 11px; transition: transform .1s; }
.zeile:last-child { border-bottom: 0; }
.zeile:active { transform: scale(.985); }
.streifen { margin-block: -11px; width: 6px; }
.f-gold .streifen { width: 7px; }
.zeile .c-ort b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.zeile .c-preis b { font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.f-gold .c-preis b { font-size: 17px; }
.zeile .pfeil { color: var(--muted); opacity: .7; }
.prozent { align-self: flex-end; display: inline-block; margin-top: 2px; padding: 1px 7px; border-radius: 999px; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.06); color: var(--fg); }
.f-gold .prozent { background: #8a5a00; color: #fff; }
.f-gruen .prozent { background: var(--gruen); color: #fff; }
.f-gelb .prozent { background: color-mix(in srgb, var(--gelb) 30%, transparent); color: var(--fg); }
.f-anfrage .prozent { background: color-mix(in srgb, var(--anfrage) 18%, transparent); color: var(--anfrage); }
.zeile small { margin-top: 5px; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--muted) 30%, transparent); }
.neu { border-radius: 999px; padding: 1px 7px; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 22%, transparent); }
.gruppe { margin: 0 10px 8px; border: 0; border-radius: 12px; background: var(--surface); box-shadow: var(--karte-schatten); padding: 8px 10px 8px 12px; }
.allegesehen { border-radius: 999px; padding: 5px 10px; }

  @keyframes pulsRot { 0% { box-shadow: 0 0 0 0 rgba(255,77,94,.6); } 70% { box-shadow: 0 0 0 8px rgba(255,77,94,0); } 100% { box-shadow: 0 0 0 0 rgba(255,77,94,0); } } }

/* 5.1: Startbild (ca. 4 s) – läuft im Takt des Radar-Tons: Ping bei 0,075 s, 1,455 s, 2,84 s (Abstand 1,38 s).
   Der Zeiger dreht genau eine Runde pro Ping, bei jedem Ping pulsiert die Mitte und eine Welle läuft raus,
   Treffer leuchten auf, wenn der Zeiger sie überstreicht; beim dritten Ping wird der Gold-Treffer markiert. */
#start { position: fixed; inset: 0; z-index: 9999; display: grid; place-content: center; justify-items: center; gap: 26px; background: radial-gradient(120% 80% at 50% 40%, #24486b 0%, #15293d 55%, #0b1724 100%); color: #fff; font-family: var(--font); transition: opacity .38s ease, transform .38s ease; touch-action: none; user-select: none; -webkit-user-select: none; }
#start.weg { opacity: 0; transform: scale(1.06); pointer-events: none; }
#start:not(.los) *, #start:not(.los) *::before, #start:not(.los) *::after { animation-play-state: paused !important; }
.st-radar { position: relative; width: 204px; height: 204px; border-radius: 50%; background: radial-gradient(circle, rgba(255,204,51,.10) 0%, rgba(255,204,51,0) 70%); }
.st-radar > span { position: absolute; inset: 0; border-radius: 50%; }
.st-ring { border: 1.5px solid rgba(255,204,51,.32); }
.st-radar > .st-ring.r2 { inset: 30px; } .st-radar > .st-ring.r3 { inset: 58px; border-color: rgba(255,204,51,.22); }
.st-kreuz::before, .st-kreuz::after { content: ""; position: absolute; background: rgba(255,204,51,.14); }
.st-kreuz::before { left: 50%; top: 0; bottom: 0; width: 1px; } .st-kreuz::after { top: 50%; left: 0; right: 0; height: 1px; }
.st-sweep { background: conic-gradient(rgba(255,204,51,0) 0deg 250deg, rgba(255,204,51,.5) 360deg); }
.st-sweep::after { content: ""; position: absolute; left: calc(50% - 1px); top: 0; width: 2px; height: 50%; border-radius: 2px; background: linear-gradient(to top, rgba(255,212,90,.15), #ffd45a); }
.st-radar > .st-blip { inset: auto; left: 50%; top: 50%; width: 0; height: 0; transform: rotate(var(--a)) translateY(calc(-1 * var(--r))); }
.st-blip::after, .st-blip::before { content: ""; position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; }
.st-blip::after { background: var(--c); box-shadow: 0 0 10px var(--c); opacity: .8; }
.st-blip::before { border: 2px solid var(--c); box-sizing: border-box; opacity: 0; }
.st-radar > .st-ping { inset: 64px; border: 2px solid #ffcc33; opacity: 0; }
.st-radar > .st-mitte { inset: 64px; background: #0b1724; border: 3px solid #ffcc33; display: grid; place-items: center; box-shadow: 0 0 0 6px rgba(11,23,36,.55), 0 6px 18px rgba(0,0,0,.45); }
.st-mitte svg { width: 42px; height: auto; display: block; }
.st-name { font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
.st-name em { font-style: normal; color: #ffcc33; }
.st-sub { margin-top: -14px; font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,.72); }
@media (prefers-reduced-motion: no-preference) {
  .st-ring { animation: stRing .5s cubic-bezier(.2,.8,.2,1) both; } .st-ring.r2 { animation-delay: .06s; } .st-ring.r3 { animation-delay: .12s; }
  .st-sweep { animation: stEin .3s ease both, stDreh 1.38s linear .075s infinite; }
  .st-mitte { animation: stPop .45s cubic-bezier(.3,1.5,.5,1) both, stPuls 1.38s ease-out .075s 3; }
  .st-ping { animation: stPing 1.38s cubic-bezier(.1,.6,.3,1) .075s 3 both; }
  .st-blip::after { animation: stBlip 1.38s linear infinite both; }
  .st-blip.b2::after { animation-delay: .65s; } .st-blip.b3::after { animation-delay: .99s; } .st-blip.b4::after { animation-delay: 1.225s; } .st-blip.b1::after { animation-delay: 1.677s; }
  .st-blip.b1::before { animation: stFund 1s ease-out 2.84s both; }
  .st-name { animation: stHoch .55s cubic-bezier(.2,.8,.2,1) .5s both; }
  .st-sub { animation: stHoch .55s cubic-bezier(.2,.8,.2,1) .85s both; }
  @keyframes stRing { from { opacity: 0; transform: scale(.7); } }
  @keyframes stEin { from { opacity: 0; } }
  @keyframes stDreh { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes stPop { from { opacity: 0; transform: scale(.4); } }
  @keyframes stPuls { 0% { scale: 1; } 7% { scale: 1.13; box-shadow: 0 0 0 6px rgba(11,23,36,.55), 0 0 30px 8px rgba(255,204,51,.55); } 35%, 100% { scale: 1; box-shadow: 0 0 0 6px rgba(11,23,36,.55), 0 6px 18px rgba(0,0,0,.45); } }
  @keyframes stPing { 0% { opacity: .9; transform: scale(1); } 75%, 100% { opacity: 0; transform: scale(3); } }
  @keyframes stBlip { 0% { opacity: 0; transform: scale(.3); } 4% { opacity: 1; transform: scale(1.8); } 25% { opacity: .95; transform: scale(1); } 100% { opacity: .3; transform: scale(1); } }
  @keyframes stFund { 0% { opacity: 0; transform: scale(1); } 2% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }
  @keyframes stHoch { from { opacity: 0; transform: translateY(12px); } }
}

}
/* 4.0: keine Farbstreifen mehr – die Karte selbst zeigt die Farbe; Prozent-Schilder klar unterschiedlich */
.tabelle .zeile .streifen { background: transparent; }
.tabelle .zeile.f-gold .prozent { background: transparent; color: #ffd45a; box-shadow: inset 0 0 0 1.5px #ffcc33; }
.tabelle .zeile.f-gelb .prozent { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--fg); }
.ueberblick .chip.c-gelb { background: var(--surface); box-shadow: var(--karte-schatten); }
.d-inhalt .preisblock.f-gelb { box-shadow: var(--karte-schatten); }
/* 5.2: 🥇 Gold als echte Goldkarte („Goldbarren“): helles, glänzendes Gold mit dunkler Schrift – in hell und dunkel gleich */
.zeile.f-gold, .preisblock.f-gold { background: linear-gradient(115deg, rgba(255,255,255,0) 28%, rgba(255,255,255,.42) 45%, rgba(255,255,255,0) 60%), linear-gradient(135deg, #fbe7a1 0%, #f2c94c 38%, #dca826 72%, #c38f12 100%); box-shadow: var(--karte-schatten), inset 0 0 0 1px rgba(140,95,0,.35); color: #2b1d00; }
.zeile.f-gold.klingel { box-shadow: var(--karte-schatten), inset 0 0 0 3px var(--accent); }
.zeile.f-gold .c-ort b, .zeile.f-gold .c-km b, .zeile.f-gold .c-preis b { color: #2b1d00; }
.zeile.f-gold .c-ort .uhr, .zeile.f-gold .pfeil, .zeile.f-gold small, .zeile.f-gold span span { color: #574006; }
.zeile.f-gold small { border-top-color: rgba(90,60,0,.28); }
.tabelle .zeile.f-gold .prozent { background: #2b1d00; color: #ffd45a; box-shadow: none; }
.zeile.f-gold .tag.t-morgen, .zeile.f-gold .tag.t-spaeter { background: rgba(60,40,0,.15); color: #2b1d00; }
.zeile.f-gold small .trend.ab, .zeile.f-gold small .trend.neu-preis, .zeile.f-gold small .trend.r-heim { background: rgba(60,40,0,.15); color: #2b1d00; }
.zeile.f-gold small .trend.r-schlecht { background: rgba(200,16,46,.15); color: #9b0c22; }
.zeile.f-gold small .trend.r-mittel { background: #fff3c4; color: #3a2f00; }
.preisblock.f-gold .gross, .preisblock.f-gold .proz { color: #2b1d00; }
.preisblock.f-gold .klein { color: #574006; }
.chip.c-gold { background: linear-gradient(135deg, #f8dc7a, #d9a520); color: #2b1d00; }
.u-gold span { background: linear-gradient(135deg, #f8dc7a, #d9a520); color: #2b1d00; border-color: #fff; }
/* 5.5: 🔙 Rückweg – Tour angenommen, der Wächter sucht Rückladungen ab dem Entladeort */
.rw-an { width: 100%; border: 0; border-radius: 14px; padding: 13px 14px; font: 700 15px var(--font); color: var(--fg); background: var(--surface); box-shadow: var(--karte-schatten); cursor: pointer; }
.rw-an:active { transform: scale(.985); }
.rueckweg-kasten { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, #1f6fd1 13%, var(--surface)); box-shadow: var(--karte-schatten); font-size: 13.5px; }
.rueckweg-kasten > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.rueckweg-kasten b { font-size: 15px; }
.rueckweg-kasten .rw-status { color: var(--muted); }
.rueckweg-kasten .rw-status.warn { color: var(--accent); }
.rueckweg-kasten.fertig { background: color-mix(in srgb, #1e8e4a 13%, var(--surface)); font-weight: 600; }
.rw-aus { flex: none; border: 0; border-radius: 999px; padding: 8px 12px; font: 700 13px var(--font); background: var(--surface); color: var(--fg); box-shadow: var(--karte-schatten); cursor: pointer; }
.gruppe.rw-leiste { display: flex; align-items: center; justify-content: space-between; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--fg);
  background: color-mix(in srgb, #1f6fd1 13%, var(--surface)); }
.gruppe.rw-leiste span { min-width: 0; }
.trend.rueckweg { background: #1f6fd1; color: #fff; }
.trend.angenommen { background: #1e8e4a; color: #fff; }
.zeile.f-gold small .trend.rueckweg { background: #1f4f8f; color: #fff; }
.zeile.f-gold small .trend.angenommen { background: #14673a; color: #fff; }

window.startTonPuffer = function (ctx) {
  var bin = atob(START_TON), u = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Promise(function (ok, fehl) { ctx.decodeAudioData(u.buffer, ok, fehl); });
};
window.startTonSpielen = function (ctx, puffer, wann) {
  var q = ctx.createBufferSource(), g = ctx.createGain();
  q.buffer = puffer; q.connect(g); g.connect(ctx.destination); q.start(wann);
  return { q: q, g: g };
};
/* Startbild nur beim echten Öffnen der App – nicht beim Neuladen nach einem Update; Antippen überspringt es.
   Mit Ton wartet die Animation, bis der Ton bereit ist (höchstens 0,6 s), und startet dann zeitgleich mit ihm. */
(function () {
  var s = document.getElementById('start'); if (!s) return;
  var schon = false;
  try { schon = sessionStorage.getItem('fw_start') === '1'; sessionStorage.setItem('fw_start', '1'); } catch (e) {}
  if (schon) { s.remove(); return; }
  var ruhig = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var tourLink = /^#tour-/.test(location.hash);
  var dauer = tourLink ? 650 : ruhig ? 900 : 3550;
  var gestartet = false, klang = null, ctx = null;
  function weg(getippt) {
    if (s.classList.contains('weg')) return;
    s.classList.add('weg'); setTimeout(function () { s.remove(); }, 420);
    if (getippt && klang) { try { klang.g.gain.setTargetAtTime(0, ctx.currentTime, 0.06); klang.q.stop(ctx.currentTime + 0.4); } catch (e) {} }
  }
  function starte(nachMs) {
    if (gestartet) return; gestartet = true;
    setTimeout(function () { s.classList.add('los'); setTimeout(weg, dauer); }, nachMs || 0);
  }
  s.addEventListener('pointerdown', function () { starte(0); weg(true); });
  var mitTon = false;
  try { mitTon = localStorage.getItem('fw_ton') !== '0' && localStorage.getItem('fw_startton') !== '0'; } catch (e) {}
  if (!mitTon || tourLink || ruhig) { starte(0); return; }
  setTimeout(function () { starte(0); }, 600);   // Ton nicht rechtzeitig bereit → ohne Ton weiter
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    var bereit = ctx.state === 'running' ? Promise.resolve() : ctx.resume();
    Promise.all([bereit, window.startTonPuffer(ctx)]).then(function (r) {
      if (gestartet || ctx.state !== 'running') return;
      var vorlauf = 0.06, latenz = (ctx.outputLatency || ctx.baseLatency || 0);
      klang = window.startTonSpielen(ctx, r[1], ctx.currentTime + vorlauf);
      starte(Math.round((vorlauf + latenz) * 1000));
    }).catch(function () {});
    setTimeout(function () { try { ctx.close(); } catch (e) {} }, 6000);
  } catch (e) { starte(0); }
})();
</script>

<script>
// PARSER-START – liest die Meldungen des Fracht-Wächters (ntfy) in Angebote um
const FARBEN = { '🥇': 'gold', '🟢': 'gruen', '🟡': 'gelb', '🔴': 'rot', '🔵': 'anfrage' };
const FARB_NAME = { gold: 'Gold', gruen: 'sehr gut', gelb: 'geht so', rot: 'lohnt nicht', anfrage: 'Preis abklären' };
const ARTEN = { '☀️': 'Heute leer', '🌙': 'Nacht', '🔁': 'Nacht und zurück', '🛣️': 'Fernfahrt' };
const zahlAus = (s) => (s == null ? null : Number(String(s).replace(/\./g, '').replace(',', '.')));
function datumAus(wort, basis) {
  const d = new Date(basis); d.setHours(0, 0, 0, 0);
  if (wort === 'heute') return d;
  if (wort === 'morgen') { d.setDate(d.getDate() + 1); return d; }
  const m = /^(\d{1,2})\.(\d{1,2})\.$/.exec(wort || '');
  if (!m) return null;
  const x = new Date(d.getFullYear(), Number(m[2]) - 1, Number(m[1]));
  if (x.getTime() < d.getTime() - 180 * 864e5) x.setFullYear(x.getFullYear() + 1);
  return x;
}
function fensterAus(text, basis) {
  const t = String(text || '').replace(/\s*\(.*?\)\s*/g, ' ').trim();
  const m = /^(heute|morgen|\d{1,2}\.\d{1,2}\.)(?:\s+–\s+(heute|morgen|\d{1,2}\.\d{1,2}\.))?,?\s*(\d{2}:\d{2})?(?:–(\d{2}:\d{2}))?/.exec(t);
  if (!m) return { von: null, bis: null, uhr: t };
  const von = datumAus(m[1], basis), bis = m[2] ? datumAus(m[2], basis) : von;
  // „ohne Uhrzeit“ (neu) bzw. „00:00 Uhr“ (ältere Meldungen): im Angebot steht keine Zeit
  if (/ohne Uhrzeit/.test(t) || (m[3] === '00:00' && !m[4])) return { von, bis, uhr: 'ohne Zeit', unklar: true };
  return { von, bis, uhr: m[3] ? m[3] + (m[4] ? '–' + m[4] : ' Uhr') : '' };
}
// Touren mit mehr Lade- oder Entladestellen kommen nicht in die App (der Wächter meldet sie ab v10.0 gar nicht mehr)
const MAX_STELLEN = 2;
function parseMeldung(msg) {
  if (!msg || msg.event !== 'message') return null;
  const titel = String(msg.title || '');
  const route = /·\s*([^·]+?)\s+→\s+([^·]+?)(?:\s+⚠️)?\s*$/.exec(titel);
  if (!route || /^MUSTER/.test(titel)) return null;
  const basis = (msg.time || 0) * 1000;
  const a = {
    id: msg.sequence_id || msg.id, zeit: basis, kanal: /-heute$/.test(msg.topic) ? 'heute' : /-preis$/.test(msg.topic) ? 'preis' : 'morgen',
    start: route[1].trim(), ziel: route[2].trim(), farbe: null, art: null, preis: null, deckung: null, symbole: [],
    laden: null, entladen: null, ladenText: '', entladenText: '', zurueck: '', tage: null,
    leerKm: null, lastKm: null, heimKm: null, anfahrtAb: '', lm: null, t: null, stopps: null, ladeStellen: 1, entladeStellen: 1, rueckweg: false, rueckZuId: '', rueckwegText: '',
    ueber: null, euroKm: null, vorher: '', zahlung: null, mindest: null, vorschlag: null,
    firma: '', sterne: '', name: '', tel: '', mobil: '', mail: '', info: '', hinweise: [],
    telUrl: '', mailUrl: '', timocomUrl: '', knapp: /⚠️\s*$/.test(titel), ladenAb: null, ende: null, punkte: [], details: []
  };
  const kl = /#tour-[A-Za-z0-9_-]+\.(\d+)\.(\d+)/.exec(String(msg.click || ''));
  if (kl) { a.ladenAb = Number(kl[1]) * 60000; a.ende = Number(kl[2]) * 60000; }
  // Koordinaten für die Karte (.wA…~L…~E…): A = LKW-Standort, L = Ladestelle, E = Entladestelle
  const kw = /\.w([ALE][-\d.,~ALE]+)/.exec(String(msg.click || ''));
  // ab Wächter 9.9: ganze Beschreibung aus Timocom (Ware, Zahlung, Lademitteltausch, Bemerkung) hinten am Link: !i=<Text>
  const ki = /!i=([^#]*)$/.exec(String(msg.click || ''));
  if (ki) { try { a.details = decodeURIComponent(ki[1]).split('\n').map((z) => { const m = /^([^:]{2,20}):\s*(.*)$/.exec(z); return m ? [m[1], m[2]] : ['Info', z]; }).filter((x) => x[1]); } catch (e) { /* kaputt: ohne */ } }
  // ab Wächter 9.7 mit Postleitzahl: L51.4556,7.0116,45127
  if (kw) kw[1].split('~').forEach((x) => { const m = /^([ALE])(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)(?:,(\d{4,5}))?$/.exec(x); if (m) a.punkte.push({ typ: m[1], lat: Number(m[2]), lon: Number(m[3]), plz: m[4] || '' }); });
  { const l = a.punkte.find((x) => x.typ === 'L'), e = a.punkte.filter((x) => x.typ === 'E').pop(); a.plzStart = (l && l.plz) || ''; a.plzZiel = (e && e.plz) || ''; }
  const kopf = titel.slice(0, titel.indexOf(route[0]));
  for (const k in FARBEN) if (kopf.indexOf(k) !== -1) { a.farbe = FARBEN[k]; break; }
  for (const k in ARTEN) if (kopf.indexOf(k) !== -1) a.art = ARTEN[k];
  if (kopf.indexOf('🏆') !== -1) a.symbole.push('🏆 Bestes heute');
  if (kopf.indexOf('🔄') !== -1) a.symbole.push('🔄 Preis geändert');
  if (kopf.indexOf('🤝') !== -1) a.symbole.push('🤝 Stammkunde');
  if (kopf.indexOf('✅') !== -1) a.symbole.push('✅ passt zum Auflieger');
  if (kopf.indexOf('🔙') !== -1) { a.rueckweg = true; a.symbole.push('🔙 Rückweg'); }
  { const rz = /^[^#]*#tour-[A-Za-z0-9_-]+(?:\.\d+\.\d+)?\.r([A-Za-z0-9_-]+)/.exec(String(msg.click || '').split('!i=')[0]); if (rz) a.rueckZuId = rz[1]; }
  const p = /(\d[\d.]*) € \((\d+) %\)/.exec(kopf);
  if (p) { a.preis = zahlAus(p[1]); a.deckung = Number(p[2]); }
  if (!a.farbe) a.farbe = a.preis == null ? 'anfrage' : 'gelb';
  for (const zeile of String(msg.message || '').split('\n')) {
    const z = zeile.trim();
    let m;

      const n = /\s*\((\d+) Ladestellen\)/.exec(m[1]); if (n) a.ladeStellen = Number(n[1]);

    } else if ((m = /^🕐 Entladen: (.*)$/.exec(z))) {

      a.entladenText = teile[0].replace(/\s*\(\d+ Entladestellen\)/, ''); a.entladen = fensterAus(a.entladenText, basis);
      teile.slice(1).forEach((x) => { const r = /zurück ca\. (.*)/.exec(x); if (r) a.zurueck = r[1]; const t = /([\d,]+) Fahrertage/.exec(x); if (t) a.tage = zahlAus(t[1]); });
    } else if ((m = /^🛣 ([\d.]+) \+ ([\d.]+)(?: \+ ([\d.]+))? km(.*)$/.exec(z))) {
      a.leerKm = zahlAus(m[1]); a.lastKm = zahlAus(m[2]); a.heimKm = m[3] ? zahlAus(m[3]) : null;
      m[4].split(' · ').forEach((x) => {
        let r;
        if ((r = /Anfahrt ab (.+?)(?: \(LKW-Route\))?(?: \((\d+) Stopps\))?$/.exec(x))) { a.anfahrtAb = r[1]; if (r[2]) a.stopps = Number(r[2]); }
        else if ((r = /^([\d,]+) m$/.exec(x.trim()))) a.lm = zahlAus(r[1]);
        else if ((r = /^([\d,]+) t$/.exec(x.trim()))) a.t = zahlAus(r[1]);
      });
    } else if (/^💶 /.test(z)) {
      const r1 = /([+−-])([\d.]+) € (über|unter) Kosten/.exec(z); if (r1) a.ueber = (r1[1] === '+' ? 1 : -1) * zahlAus(r1[2]);
      const r2 = /([\d,]+) €\/km/.exec(z); if (r2) a.euroKm = zahlAus(r2[1]);
      const r3 = /vorher ([\d.]+ €|ohne Preis)/.exec(z); if (r3) a.vorher = r3[1];
      const r4 = /Zahlung (\d+) Tage/.exec(z); if (r4) a.zahlung = Number(r4[1]);
      const r5 = /mindestens ([\d.]+) €/.exec(z); if (r5) a.mindest = zahlAus(r5[1]);
      const r6 = /Vorschlag ([\d.]+) €/.exec(z); if (r6) a.vorschlag = zahlAus(r6[1]);
    } else if ((m = /^📞 (.*)$/.exec(z))) {
      const teile = m[1].split(' · ');
      const f = /^(.*?)\s*(?:★([\d,]+))?$/.exec(teile.shift() || ''); a.firma = f[1].trim(); a.sterne = f[2] || '';
      teile.forEach((x) => {
        x = x.trim();
        if (/^mobil /.test(x)) a.mobil = x.slice(6);
        else if (/^\+?[\d][\d\s/()-]{5,}$/.test(x)) a.tel = a.tel || x;
        else if (!/Messenger|nicht abrufbar/.test(x)) a.name = a.name || x;
      });
    } else if ((m = /^✉ (.*)$/.exec(z))) a.mail = m[1].split(' · ')[0].trim();
    else if ((m = /^ℹ (.*)$/.exec(z))) a.info = m[1];
    else if (/^🔙 /.test(z)) { a.rueckwegText = z; a.hinweise.push(z); }
    else if (/^(🏠|↩|➡️|⚠️|✅)/.test(z)) a.hinweise.push(z);
  }
  (msg.actions || []).forEach((x) => {
    const u = String(x.url || '');
    if (/^tel:/.test(u) && !a.telUrl) a.telUrl = u;
    else if (/^mailto:/.test(u)) a.mailUrl = u;
    else if (/^https:\/\/my\.timocom\.com\//.test(u)) a.timocomUrl = u;
  });
  if (a.ladeStellen > MAX_STELLEN || a.entladeStellen > MAX_STELLEN) return null;
  return a;
}
// Alle Ereignisse eines oder mehrerer Kanäle -> aktuelle Angebote (gelöschte fallen raus, Updates ersetzen)
function angeboteAus(ereignisse) {
  const nachId = new Map(), weg = new Set();
  ereignisse.slice().sort((x, y) => (x.time || 0) - (y.time || 0)).forEach((e) => {
    const sid = e.sequence_id || e.id;
    if (e.event === 'message_delete') { weg.add(e.topic + '|' + sid); nachId.delete(e.topic + '|' + sid); return; }
    if (e.event !== 'message') return;
    const a = parseMeldung(e);
    if (a && !weg.has(e.topic + '|' + sid)) nachId.set(e.topic + '|' + sid, a);
  });
  return Array.from(nachId.values());
}
// PARSER-END
</script>

  // ---------- 💚 Läuft am PC wirklich alles? Lebenszeichen vom Fracht-Wächter (Kanal …-pc, ab Wächter 10.2) ----------
  let pcStand = null;

  // ---------- 🔙 Rückweg: Tour angenommen → der Fracht-Wächter am PC sucht Rückladungen ab dem Entladeort ----------
  // Die App schreibt „an“/„aus“ in den ntfy-Kanal …-auftrag, der Wächter bestätigt mit „ok“ und meldet Treffer mit 🔙.
  const HEIM_KM = 100, HEIM_NAME = 'Duisburg'; // HEIM (Koordinaten) steht weiter unten beim Firmen-/Rückladungsteil
  function kmLuft(p, q) {

    return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));

  const auftragAktiv = (x) => !!x && !x.aus && Date.now() < (Number(x.ende) || 0) + 36 * 36e5;
  const aktiveAuftraege = () => Object.keys(auftraege).map((k) => auftraege[k]).filter(auftragAktiv);
  function auftraegeMerken() {
    Object.keys(auftraege).forEach((k) => { if (Date.now() > (Number(auftraege[k].ende) || 0) + 3 * 864e5) delete auftraege[k]; });

  function auftraegeAus(ev) {
    ev.filter((m) => m && m.event === 'message').sort((x, y) => (x.time || 0) - (y.time || 0)).forEach((m) => {
      let d = null; try { d = JSON.parse(m.message); } catch (e) { return; }

      } else if (alt && d.typ === 'aus' && t >= ab && !alt.aus) { alt.aus = t; alt.grundAus = 'beendet'; }

  async function auftragSenden(d) {

        auftraege[a.id] = { id: a.id, tour: a.start + ' → ' + a.ziel, ort: a.ziel, lat: ziel.lat, lon: ziel.lon, ende: ende, seit: Date.now(), ok: 0, aus: 0, grundAus: '' };
        hinweis('Der Fracht-Wächter am PC sucht jetzt Rückladungen ab ' + a.ziel + ' Richtung ' + HEIM_NAME + ' (frei ab ' + wannKurz(ende) + '). Treffer kommen mit 🔙.');

      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap' }).addTo(map);
      const zeichen = (p, i) => {
        const nr = orte.length > 2 && p.typ !== 'A' ? orte.indexOf(p) + 1 : '';
        const html = p.typ === 'A' ? '🚛' : p.typ === 'L' ? '↓' + nr : '↑' + nr;
        return L.marker([p.lat, p.lon], { icon: L.divIcon({ className: 'punkt p-' + p.typ, html: '<span>' + html + '</span>', iconSize: [30, 30], iconAnchor: [15, 15] }), keyboard: false });
      };
      const grenzen = L.latLngBounds(punkte.map((p) => [p.lat, p.lon]));
      map.fitBounds(grenzen, { padding: [28, 28] });
      // Anfahrt (gestrichelt) und beladene Strecke (durchgezogen)
      const start = punkte.find((p) => p.typ === 'A');
      const [anfahrt, tour] = await Promise.all([start ? strasse([start, orte[0]]) : Promise.resolve(null), strasse(orte)]);
      if (karte !== meins) return;
      if (start) L.polyline(anfahrt ? anfahrt.linie : [[start.lat, start.lon], [orte[0].lat, orte[0].lon]], { color: '#64748b', weight: 4, dashArray: '6 9', opacity: .9 }).addTo(map);
      const linie = tour ? tour.linie : orte.map((p) => [p.lat, p.lon]);
      L.polyline(linie, { color: '#ffffff', weight: 9, opacity: .9 }).addTo(map);
      const pfad = L.polyline(linie, { color: '#1f6feb', weight: 5, opacity: 1, dashArray: tour ? null : '2 10' }).addTo(map);
      punkte.forEach((p, i) => zeichen(p, i).addTo(map));
      map.fitBounds(pfad.getBounds().extend(grenzen), { padding: [28, 28] });
      if (tour || anfahrt) map.attributionControl.addAttribution('Route: OSRM');
      const t = [];
      if (anfahrt) t.push('🚛 ' + zahl(anfahrt.km, 0) + ' km Anfahrt');
      // Fahrzeit wie im Fracht-Wächter gerechnet: LKW-Schnitt 60 km/h, reine Fahrzeit ohne Pausen
      const lkwStd = (km) => { const m = Math.round(km / 60 * 60); return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' Std.'; };
      if (tour) t.push('🛣 ' + zahl(tour.km, 0) + ' km beladen · LKW ca. ' + lkwStd(tour.km) + ' Fahrzeit');
      info.textContent = t.length ? t.join(' · ') : (punkte.length === orte.length && !a.punkte.length ? 'Orte ungefähr (nur Stadt bekannt)' : 'Strecke ungefähr (Luftlinie)');
      navs.textContent = '';
      navs.appendChild(h('a', { class: 'knopf nav', href: navLink(orte[0]), target: '_blank', rel: 'noopener' }, h('span', { 'aria-hidden': 'true', text: '🧭' }), 'Zur Ladestelle'));
      navs.appendChild(h('a', { class: 'knopf nav', href: navLink(orte[orte.length - 1], orte.slice(0, -1)), target: '_blank', rel: 'noopener' }, h('span', { 'aria-hidden': 'true', text: '🗺' }), 'Ganze Tour'));
      // Antippen: große Karte zum Verschieben und Zoomen
      const gross = (an) => {
        box.classList.toggle('gross', an);
        ['dragging', 'touchZoom', 'scrollWheelZoom', 'doubleClickZoom'].forEach((x) => map[x][an ? 'enable' : 'disable']());
        if (an) { if (!map.zoomControl) { map.zoomControl = L.control.zoom({ position: 'bottomright' }); } map.zoomControl.addTo(map); } else if (map.zoomControl) map.zoomControl.remove();
        setTimeout(() => { map.invalidateSize(); map.fitBounds(pfad.getBounds().extend(grenzen), { padding: an ? [60, 40] : [28, 28] }); }, 60);
      };
      flaeche.addEventListener('click', () => { if (!box.classList.contains('gross')) gross(true); });
      zu.addEventListener('click', (e) => { e.stopPropagation(); gross(false); });
    })();
    return box;
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { schliesse(); } });

  // ---------- Einstellungen ----------
  function einstellungen() {
    const eb = $('ebene'); eb.textContent = '';

      h('h2', { text: 'Einstellungen' }),
      h('label', { for: 'f-ton' }, 'Ton für 🌅 Morgen La-Lie und 🥇 Gold (wenn die App offen ist)',
        h('div', { style: 'display:flex;gap:8px' }, tonWahl, h('button', { type: 'button', class: 'probe', onclick: () => { audioFreischalten(); setTimeout(() => spiele(tonWahl.value), 80); }, text: '▶ Anhören' }))),
      h('label', { for: 'f-ton2' }, 'Ton für ☀️ Heute La-Lie',
        h('div', { style: 'display:flex;gap:8px' }, tonWahl2, h('button', { type: 'button', class: 'probe', onclick: () => { audioFreischalten(); setTimeout(() => spiele(tonWahl2.value), 80); }, text: '▶ Anhören' }))),
      h('div', { style: 'display:flex;align-items:center;gap:8px' },
        h('label', { for: 'f-startton', style: 'flex-direction:row;align-items:center;gap:10px;flex:1;color:var(--fg);font-size:14px' }, startTon, '📡 Radar-Geräusch beim Öffnen'),
        h('button', { type: 'button', class: 'probe', onclick: () => { audioFreischalten(); setTimeout(() => { try { if (audio && window.startTonPuffer) window.startTonPuffer(audio).then((p) => window.startTonSpielen(audio, p, audio.currentTime + 0.05)); } catch (e) { /* egal */ } }, 80); }, text: '▶ Anhören' })),
      h('p', { text: 'Der Ton läuft über die Medien-Lautstärke des Handys. Ist sie leise gestellt, hörst du ihn kaum.' }),
      h('p', { text: 'Verbindung: Name deines Hauptkanals (wie in der ntfy-App, ohne „-heute“ und „-preis“). Die App liest dann deine echten Meldungen und aktualisiert sich alle 30 Sekunden.' }),
      h('label', { for: 'f-kanal' }, 'Kanal', kanal), h('label', { for: 'f-token' }, 'Zugriffstoken (optional)', token),
      h('div', { class: 'reihe' }, h('button', { type: 'button', onclick: schliesse, text: 'Abbrechen' }), h('button', { type: 'submit', class: 'haupt', text: 'Speichern' })),

  $('einst').addEventListener('click', einstellungen);
  $('neu').addEventListener('click', () => lade());

  // ---------- Daten laden ----------
  async function holeKanal(topic, token) {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(topic) + '/json?poll=1&since=24h', { headers: token ? { Authorization: 'Bearer ' + token } : {} });
    if (!r.ok) throw new Error('ntfy ' + r.status);
    return (await r.text()).split('\n').filter(Boolean).map((z) => { try { return JSON.parse(z); } catch (e) { return null; } }).filter(Boolean);
  }
  let letzteSichtbareLadung = 0;

  // ---------- Tagesrückblick: was heute gemeldet wurde (auch Touren, die schon wieder weg sind) ----------
  const tagKey = () => { const d = new Date(); return 'tag_' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  function tagLesen() { try { return JSON.parse(lies(tagKey(), '{}')) || {}; } catch (e) { return {}; } }
  function tagMerken(ereignisse, heute0) {
    const tag = tagLesen(), da = new Set(angebote.map((a) => a.id));
    ereignisse.forEach((e) => {
      if (e.event !== 'message' || (e.time || 0) * 1000 < heute0) return;
      const a = parseMeldung(e);
      if (!a || !a.start || !a.ziel) return;
      tag[a.id] = { f: a.farbe, d: a.deckung, p: a.preis, s: a.start, z: a.ziel, t: a.zeit, l: istLaLie(a) ? 1 : istMorgenLaLie(a) ? 2 : 0, tr: trendVon(a), fi: a.firma || '' };
    });
    Object.keys(tag).forEach((id) => { tag[id].w = da.has(id) ? 0 : 1; });
    schreib(tagKey(), JSON.stringify(tag));
    // ältere Tage aufräumen
    try { Object.keys(localStorage).filter((k) => /^fw_tag_/.test(k) && k !== 'fw_' + tagKey()).forEach((k) => localStorage.removeItem(k)); } catch (e) { /* egal */ }
  }
  // ---------- Firmen-Gedächtnis: welche Touren hat eine Firma in den letzten 14 Tagen gemeldet? ----------
  const firmaKey = (name) => String(name || '').toLowerCase().replace(/[^a-z0-9äöüß]+/g, ' ').trim();
  function firmenLesen() { try { return JSON.parse(lies('firmen', '{}')) || {}; } catch (e) { return {}; } }
  function firmenMerken(ereignisse) {
    const alle = firmenLesen(), grenze = Date.now() - 14 * 864e5;
    ereignisse.forEach((e) => {
      if (e.event !== 'message') return;
      const a = parseMeldung(e);
      const k = a && firmaKey(a.firma);
      if (!k || !a.start || !a.ziel) return;
      const l = alle[k] = alle[k] || [];
      const alt = l.findIndex((x) => x.i === a.id);
      const neu = { i: a.id, t: a.zeit, s: a.start, z: a.ziel, p: a.preis, d: a.deckung };
      if (alt >= 0) l[alt] = neu; else l.push(neu);
    });
    Object.keys(alle).forEach((k) => { alle[k] = alle[k].filter((x) => x.t >= grenze).sort((x, y) => y.t - x.t).slice(0, 40); if (!alle[k].length) delete alle[k]; });
    if (!lies('firmenSeit', '')) schreib('firmenSeit', String(Date.now()));
    schreib('firmen', JSON.stringify(alle));
  }
  function firmenAbschnitt(a) {
    const k = firmaKey(a.firma);
    if (!k) return null;
    const l = (firmenLesen()[k] || []), andere = l.filter((x) => x.i !== a.id), mitP = l.filter((x) => x.d != null);
    const seit = Number(lies('firmenSeit', '')) || Date.now();
    const tage = Math.max(1, Math.min(14, Math.ceil((Date.now() - seit) / 864e5)));
    const zeitraum = tage <= 1 ? 'seit heute' : 'in den letzten ' + tage + ' Tagen';
    const tagText = (t) => { const d = new Date(t), h0 = new Date(); return (d.toDateString() === h0.toDateString() ? 'heute' : String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.') + ' ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };
    const schnitt = mitP.length ? Math.round(mitP.reduce((s0, x) => s0 + x.d, 0) / mitP.length) : null;
    const kopf = !andere.length ? 'Erste Tour dieser Firma ' + zeitraum + '.'
      : l.length + ' Touren ' + zeitraum + (schnitt != null ? ' · im Schnitt ' + schnitt + ' %' + (mitP.length > 1 ? ' · beste ' + Math.max(...mitP.map((x) => x.d)) + ' %' : '') : '') + (l.length - mitP.length ? ' · ' + (l.length - mitP.length) + ' ohne Preis' : '');
    return h('section', { class: 'abschnitt' }, h('h2', { text: 'Firmen-Gedächtnis' }),
      h('div', { class: 'notiz', text: kopf }),
      andere.slice(0, 5).map((x) => { const da = angebote.find((y) => y.id === x.i);
        return h('button', { type: 'button', class: 'fg-tour' + (da ? '' : ' weg'), disabled: da ? null : 'disabled', onclick: () => { if (da) oeffne(da); } },
          h('b', { text: x.s + ' → ' + x.z }), h('span', { text: tagText(x.t) + ' · ' + (x.p != null ? euro(x.p) + (x.d != null ? ' · ' + x.d + ' %' : '') : 'ohne Preis') + (da ? ' · noch offen ›' : '') })); }),
      andere.length > 5 ? h('div', { class: 'notiz', text: '… und ' + (andere.length - 5) + ' weitere' }) : null);
  }

  function rueckblick() {
    const alle = Object.entries(tagLesen()).map(([id, x]) => Object.assign({ id: id }, x));
    const eb = $('ebene'); eb.textContent = '';
    const n = (f) => alle.filter(f).length;
    const mitPreis = alle.filter((x) => x.d != null).sort((x, y) => y.d - x.d || (y.p || 0) - (x.p || 0));
    const std = {}; alle.forEach((x) => { const hh = new Date(x.t).getHours(); std[hh] = (std[hh] || 0) + 1; });
    const stunden = Object.keys(std).map(Number).sort((x, y) => x - y), maxStd = Math.max(1, ...Object.values(std));
    const von = stunden.length ? Math.min(stunden[0], 8) : 8, bis = stunden.length ? Math.max(stunden[stunden.length - 1], 17) : 17;
    const balken = []; for (let hh = von; hh <= bis; hh++) balken.push(h('div', { class: 'rb-std' }, h('i', { style: 'height:' + Math.round((std[hh] || 0) / maxStd * 100) + '%', title: (std[hh] || 0) + ' Touren' }), h('span', { text: String(hh) })));
    const staerkste = stunden.length ? stunden.reduce((x, y) => (std[y] > std[x] ? y : x)) : null;
    const kachel = (zahlText, text, cls) => h('div', { class: 'rb-kachel ' + (cls || '') }, h('b', { class: 'num', text: zahlText }), h('span', { text: text }));
    const tourZeile = (x, i) => {
      const a = angebote.find((y) => y.id === x.id);
      const uhr = new Date(x.t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      return h('button', { type: 'button', class: 'rb-tour' + (a ? '' : ' weg'), disabled: a ? null : 'disabled', onclick: () => { if (a) oeffne(a); } },
        h('b', { text: (i + 1) + '. ' + x.s + ' → ' + x.z }),
        h('span', { text: (x.p != null ? euro(x.p) : '') + ' · ' + x.d + ' % · ' + uhr + ' Uhr' + (x.fi ? ' · ' + x.fi : '') + (a ? '' : ' · nicht mehr in Timocom') }));
    };
    eb.appendChild(h('div', { class: 'schleier', onclick: schliesse }));
    eb.appendChild(h('div', { class: 'blatt rueckblick', role: 'dialog', 'aria-label': 'Tagesrückblick' },
      h('h2', { text: '📊 Tagesrückblick · ' + new Date().toLocaleDateString('de-DE', { weekday: 'long', day: '2-digit', month: '2-digit' }) }),
      !alle.length ? h('p', { text: 'Heute hat der Fracht-Wächter noch keine Tour gemeldet.' }) : null,
      alle.length ? h('div', { class: 'rb-gitter' },
        kachel(String(alle.length), alle.length === 1 ? 'Tour gemeldet' : 'Touren gemeldet', 'gross'),
        kachel(String(n((x) => !x.w)), 'noch offen'),
        kachel(String(n((x) => x.w)), 'schon wieder weg')) : null,
      alle.length ? h('div', { class: 'rb-gitter vier' },
        kachel('🥇 ' + n((x) => x.f === 'gold'), 'Gold', 'k-gold'), kachel('🟢 ' + n((x) => x.f === 'gruen'), 'sehr gut', 'k-gruen'),
        kachel('🟡 ' + n((x) => x.f === 'gelb'), 'geht so'), kachel('🔵 ' + n((x) => x.f === 'anfrage'), 'ohne Preis', 'k-blau')) : null,
      alle.length ? h('div', { class: 'rb-gitter' },
        kachel('☀️ ' + n((x) => x.l === 1), 'Heute La-Lie'), kachel('🌅 ' + n((x) => x.l === 2), 'Morgen La-Lie'), kachel('↑ ' + n((x) => x.tr === 1), 'Preis erhöht')) : null,
      mitPreis.length ? h('h3', { text: 'Die besten Touren heute' }) : null,
      mitPreis.length ? h('div', { class: 'rb-liste' }, mitPreis.slice(0, 3).map(tourZeile)) : null,
      alle.length ? h('h3', { text: 'Wann kamen die Touren?' + (staerkste != null ? ' Die meisten zwischen ' + staerkste + ' und ' + (staerkste + 1) + ' Uhr (' + std[staerkste] + ')' : '') }) : null,
      alle.length ? h('div', { class: 'rb-balken', 'aria-hidden': 'true' }, balken) : null,
      h('p', { text: 'Gezählt wird, was der Fracht-Wächter heute an diese App gemeldet hat.' }),
      h('div', { class: 'reihe' }, h('button', { type: 'button', class: 'haupt', onclick: schliesse, text: 'Schließen' }))));
  }
  $('rueckblick').addEventListener('click', rueckblick);
  async function lade() {
    const kanal = lies('kanal', ''), token = lies('token', '');
    if (!kanal) { live = false; angebote = angeboteAus(beispiel()); stand = new Date(); return zeige('Beispieldaten'); }
    $('stand-text').textContent = 'lädt …'; $('neu').classList.add('dreht');
    if (!live && !$('liste').children.length) { const l = $('liste'); for (let i = 0; i < 4; i++) l.appendChild(h('div', { class: 'zeile platzhalter', 'aria-hidden': 'true' })); }
    try {
      const [teile, auftragEv, pcEv] = await Promise.all([Promise.all(['', '-heute', '-preis'].map((s) => holeKanal(kanal + s, token))),
        holeKanal(kanal + '-auftrag', token).catch(() => null), holeKanal(kanal + '-pc', token).catch(() => null)]);
      if (pcEv) pcAus(pcEv);
      if (auftragEv) { try { auftraegeAus(auftragEv); auftraegeMerken(); } catch (e) { /* egal */ } }
      const heute0 = new Date(); heute0.setHours(0, 0, 0, 0);
      const vorher = new Set(angebote.map((a) => a.id)), warLive = live;
      live = true; stand = new Date();
      angebote = angeboteAus(teile.flat()).filter((a) => !(a.laden && a.laden.bis && a.laden.bis < heute0)); // Ladetag schon vorbei
      try { tagMerken(teile.flat(), heute0.getTime()); } catch (e) { /* Rückblick ist nicht lebenswichtig */ }
      try { firmenMerken(teile.flat()); } catch (e) { /* Gedächtnis ist nicht lebenswichtig */ }
      // Neu dazugekommen, während die App offen war: piepen und die Zeilen kurz blinken lassen
      const frischDa = warLive ? angebote.filter((a) => !vorher.has(a.id) && istNeu(a)) : [];
      blinkIds = new Set(frischDa.map((a) => a.id));
      // Ton nur bei La-Lie: ☀️ Heute La-Lie (LKW-Signal) und 🌅 Morgen La-Lie (Hinweiston) – alles andere kommt still mit NEU
      // dazu 🥇 Gold, egal für welchen Tag (Hinweiston)
      const mitTon = frischDa.filter((a) => istLaLie(a) || istMorgenLaLie(a) || a.farbe === 'gold');
      if (mitTon.length && document.visibilityState === 'visible' && Date.now() - letzteSichtbareLadung < 120000) gong(mitTon.some(istLaLie));
      // Welche Tour hat geklingelt? Unten als Leiste zeigen und in der Liste markieren, bis du sie öffnest
      mitTon.forEach((a) => klingelIds.add(a.id));
      if (document.visibilityState === 'visible') letzteSichtbareLadung = Date.now();
      zeige('Live · ' + stand.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr');
      zeigeAlarm();
    } catch (e) {
      live = false; angebote = angeboteAus(beispiel());
      zeige('Keine Verbindung – Beispieldaten');
    }
  }
  function zeige(standText) {
    // „Live“ nur, wenn auch am PC alles läuft – sonst steht da, was los ist (PC offline, Timocom abgemeldet, Liste steht)
    const z = live ? pcZustand() : null;
    $('stand-text').textContent = z && z.kurz ? z.kurz : standText;
    $('stand').className = 'stand' + (z ? ' z-' + z.art : '');
    $('neu').classList.toggle('dreht', /lädt/.test(standText));
    document.body.classList.toggle('ist-live', !!live);
    $('beispiel').hidden = live;
    zeigeReiter(); zeigeListe();
    if (zielTour) {
      // Aus einer Benachrichtigung geöffnet: diese Tour direkt zeigen
      const a = angebote.find((x) => x.id === zielTour);
      zielTour = null;
      if (a) oeffne(a); else if (live) hinweis('Diese Tour ist nicht mehr verfügbar.');
    } else if (offen) { const neu = angebote.find((a) => a.id === offen.id); if (neu) oeffne(neu); }
  }
  // Persönlicher Link: Kanal steht hinter dem # (geht nicht an den Server) – einmal merken, dann aus der Adresse entfernen
  // #tour-<id> = aus einer Benachrichtigung: diese Tour öffnen
  function adresseLesen() {
    try {
      const k = decodeURIComponent((location.hash || '').slice(1));
      const t = /^tour-([A-Za-z0-9_-]+)(?:[.!][\s\S]*)?$/.exec(k);
      if (t) zielTour = t[1];
      else {
        const kt = /^([A-Za-z0-9_-]{6,64})(?:\+(tk_[A-Za-z0-9]+))?$/.exec(k);
        if (kt) { schreib('kanal', kt[1]); if (kt[2]) schreib('token', kt[2]); }
      }
      if (k) history.replaceState(null, '', location.pathname + location.search);
    } catch (e) { /* egal */ }
  }
  adresseLesen();
  window.addEventListener('hashchange', () => { adresseLesen(); if (zielTour) lade(); });
  lade();
  setInterval(() => { if (lies('kanal', '') && document.visibilityState === 'visible') lade(); }, 30000);
})();
</script>
